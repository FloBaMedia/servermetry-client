name: AgentSync

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    name: Outputs match .ai/src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned AgentSync 0.36.0
        shell: bash
        run: |
          git clone --quiet https://github.com/yelmuratoff/agent.git "$HOME/.agentsync"
          git -C "$HOME/.agentsync" checkout --quiet --detach 5c8220376c90969b393b07df83d25f50b819ba69
          test "$(git -C "$HOME/.agentsync" rev-parse HEAD)" = "5c8220376c90969b393b07df83d25f50b819ba69"
      - name: Check generated outputs
        run: AGENTSYNC_HOME="$HOME/.agentsync" "$HOME/.agentsync/bin/agentsync.sh" check
